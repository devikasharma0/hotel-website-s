<svg xmlns="http://www.w3.org/2000/svg" viewBox="17 3 326 434" width="326" height="434" role="img" color="#1C1B19" fill="none">
  <title>Antara</title>
  <desc>An onion-arched doorway framing a lotus in full bloom: solid petals and a flame at the centre, an open fan of petals behind, and a line of beads tracing the inside of the arch.</desc>
<!--
  ANTARA — hotels & retreats
  ══════════════════════════════════════════════════════════════════════
  Antara (Sanskrit अन्तर) — the inner, the space within, the interval.

  The emblem is a view through a doorway. The frame is a torana, the
  onion-crowned threshold of Indian architecture and the oldest gesture
  of welcome there is; the beading inside its crown is block-print, the
  language of a woodblock pressed onto cloth. Held inside it, a lotus in
  full bloom — solid petals in front, the open fan behind, a flame rising
  from its heart. The devotion is carried by the architecture, not
  declared: no deity, no om, nothing that dates it or narrows who it is
  for. Guests who know temple forms read a shrine door. Everyone else
  reads a flower opening in an archway.

  Colour — one ink, inherited through `currentColor`:
    ink    #1C1B19   default
    accent #8B7355   foil, brass, blind emboss
    cream  #F7F4EF   reversed out of ink or photography
  Override with CSS `color`, or edit the `color` attribute on <svg>.
  Recolouring only works when the SVG is INLINE; through <img> it keeps
  the baked colour, which is why a reversed file ships alongside.

  Clear space: the width of one jamb on every side.
  Sizes: emblem lockup at 30mm / 120px and up. Below that use the
  horizontal lockup; below 16mm / 64px use the mark alone.
-->
