<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -39 2354 635" width="2354" height="635" role="img" color="#6E4F2C" fill="none">
  <title>Antara</title>
  <desc>A swan drawn in one calligraphic line, its wing opening into a lotus in full bloom, above the wordmark ANTARA.</desc>
<!--
  ANTARA — hotels & retreats
  ══════════════════════════════════════════════════════════════════════
  Antara (Sanskrit अन्तर) — the inner, the space within, the interval.

  The mark is a hamsa: the swan of Indian iconography, the bird said to
  drink the milk and leave the water — discernment, the thing a good
  hotel does on a guest's behalf. It is drawn as one unbroken
  calligraphic line, and where its wing would fall a lotus opens
  instead. Bird and bloom share a single body, so neither reads as
  decoration applied to the other.

  Every curve is a variable-width stroke, thin at the extremities and
  full through the sweep, the way a brush loaded with ink behaves.
  The wordmark is Cormorant Garamond Light, drawn to outlines so no font
  licence or rendering engine can alter it, with a swash carrying the
  R's leg under the final A.

  Colour — one ink, inherited through `currentColor`:
    brown  #6E4F2C   default
    cream  #F2EADC   reversed out of brown or photography
  Override with CSS `color`, or edit the `color` attribute on <svg>.
  Recolouring only works INLINE; through <img> the baked colour holds,
  which is why a reversed file ships alongside.

  Clear space: the width of the lotus centre on every side.
  Sizes: the mark holds to about 44px. Below that, use the wordmark.
-->
