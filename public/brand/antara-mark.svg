<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 0 100 146" width="100" height="146"
     role="img" aria-labelledby="antara-mark-title" color="#1C1B19" fill="none">
  <title id="antara-mark-title">Antara mark</title>
  <!--
    ANTARA — mark only (app icon, favicon, key cards, embroidery, signage).
    The torana threshold with the lotus-flame held in its inner space.
    Single ink via `currentColor`: #1C1B19 ink, #8B7355 accent, #F7F4EF reversed.
    Use below 28mm / 110px, where the wordmark would close up.
  -->
  <g stroke="currentColor" stroke-width="3.6" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M 90,132 L 90,78
             C 95,62 92,50 86,44
             C 80,34 66,22 60,14
             C 54,22 40,34 34,44
             C 28,50 25,62 30,78
             L 30,132" />
    <path d="M 22,132 L 98,132" />
    <path d="M 60,59 C 76,85 74,107 60,126 C 46,107 44,85 60,59 Z"
          fill="currentColor" stroke="none" />
  </g>
</svg>
