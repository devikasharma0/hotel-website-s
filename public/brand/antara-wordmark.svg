  <title>Antara</title>
  <desc>The wordmark ANTARA, with a swash carrying the R's leg under the final A.</desc>
<!--
  ANTARA — hotels & retreats
  ══════════════════════════════════════════════════════════════════════
  Antara (Sanskrit अन्तर) — the inner, the space within.

  This is the client's own artwork, vectorised — not redrawn. The source
  raster sits beside this file as antara-logo-source.png; every curve here
  was traced from it at 2x supersample and registers on the original to
  within a pixel. Nothing was restyled, re-spaced or "improved". If the
  artwork is ever revised, re-trace it rather than editing these paths.

  A hamsa — the swan of Indian iconography — drawn as one continuous line,
  with a lotus opening where its wing would fall.

  Colour — one ink, inherited through `currentColor`:
    brown  #624B33   sampled from the source artwork
    cream  #E8DFD0   the source paper; reversed use
  Override with CSS `color`, or edit the `color` attribute on <svg>.
  Recolouring only works INLINE; through <img> the baked colour holds,
  which is why a reversed file ships alongside.
-->
